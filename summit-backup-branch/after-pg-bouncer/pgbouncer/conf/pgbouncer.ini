;; =========================================================================
;; PgBouncer config for the "after pgbouncer" demo.
;;
;; SOURCE OF TRUTH = Secrets Manager. The [databases] "summit = ..." line below
;; is only a PLACEHOLDER: on boot (and on every switch) render-from-sm.sh reads
;; the secret `after-pgb-upstream` from SM and overwrites this line with the
;; current branch's connection params. A switch = update the secret, then RELOAD.
;; Nothing in this repo is the truth — the secret is.
;;
;; LOCAL NOTE: the upstream here is a plain Postgres container, NOT Neon. So
;; none of the Neon SNI / endpoint-in-password / SCRAM-downgrade complexity from
;; the research doc (option-b §3) applies. The secret just carries host=<branch>.
;; On real Lakebase that secret would carry the endpoint-in-password token.
;; =========================================================================

[databases]
;; PLACEHOLDER — overwritten from Secrets Manager by render-from-sm.sh.
summit = host=postgres-branch-a port=5432 dbname=summit user=summit password=summit

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

;; ---- client (app -> pgbouncer) auth ----
;; trust is fine for a single-network local demo. The app's own user/password
;; are accepted as-is; pgbouncer authenticates to Postgres with the creds on the
;; [databases] line above.
auth_type   = trust
auth_file   = /etc/pgbouncer/userlist.txt
admin_users = summit
stats_users = summit

;; ---- pooling ----
;; transaction mode: a server connection returns to the pool at the END of each
;; transaction, so RECONNECT drains the old branch within one query. That is what
;; makes the A->B migration visible in seconds. Safe here because the demo apps
;; issue only simple, unprepared SELECTs (see option-b §6 for the prepared-
;; statement caveats that would matter with a real app).
pool_mode         = transaction
max_client_conn   = 1000
default_pool_size = 20

;; params the pg / Npgsql drivers may send on startup
ignore_startup_parameters = extra_float_digits,search_path
